# MyEduConnect WAF Custom Rules — CCS6324 Phase 5
# Engine: ModSecurity v3 + OWASP CRS via owasp/modsecurity-crs:nginx-alpine

# Block SQL injection in any request parameter (covers W-01 login bypass, W-02 search)
SecRule ARGS "@detectSQLi" \
    "id:9000001,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'SQL Injection blocked by WAF',\
    tag:'MYEDUCONNECT/SQLi'"

# Block XSS payloads in any request parameter (covers W-02 stored XSS)
SecRule ARGS "@detectXSS" \
    "id:9000002,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'XSS payload blocked by WAF',\
    tag:'MYEDUCONNECT/XSS'"
