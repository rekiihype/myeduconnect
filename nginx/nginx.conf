# MyEduConnect Nginx Configuration
# DELIBERATE VULNERABILITY V-12: HTTP only — no HTTPS/TLS configured
# All traffic including credentials and payment data sent in cleartext

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # DELIBERATE: Verbose server tokens (reveals Nginx version — information disclosure)
    server_tokens on;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # ── Upstream Backend ──────────────────────────────────────────────────────
    upstream backend {
        server backend:3000;
    }

    # ── Main Server Block (HTTP only — V-12) ──────────────────────────────────
    server {
        listen 80;
        server_name _;

        # DELIBERATE: No HTTPS redirect — cleartext HTTP accepted (V-12)
        # FIX (Phase 5): Add return 301 https://$host$request_uri;

        # ── Serve Static Frontend Files ────────────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        # SPA routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Proxy API Requests to Backend ─────────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;

            # DELIBERATE: No rate limiting on API routes (brute force possible)
        }

        # ── Serve Uploaded Files ───────────────────────────────────────────
        # DELIBERATE: Uploaded files (including webshells) are directly accessible
        location /uploads/ {
            proxy_pass http://backend;
        }

        # DELIBERATE: Directory listing enabled on /static/ (information disclosure)
        location /static/ {
            autoindex on;
            proxy_pass http://backend;
        }

        # DELIBERATE: No security headers configured
        # FIX (Phase 5): Add X-Frame-Options, X-XSS-Protection, Content-Security-Policy,
        #               Strict-Transport-Security, X-Content-Type-Options
    }
}
