
services:
  postgres:
    image: postgres:15-alpine
    container_name: myeduconnect-postgres
    environment:
      POSTGRES_DB: myeduconnect
      POSTGRES_USER: edu_admin
      POSTGRES_PASSWORD: Edu@Connect2026!Str0ng
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - myeduconnect-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: myeduconnect-backend
    environment:
      DATABASE_URL: postgresql://edu_admin:Edu@Connect2026!Str0ng@postgres:5432/myeduconnect
      JWT_SECRET: a8f3d2c1e7b4f9a0c3e6d8b2a5f7e1c4d9b6a3f0e8c5b2d7a4f1e9c6b3d0a7f2
      PORT: 3000
      NODE_ENV: production
    volumes:
      - ./backend/uploads:/uploads
    depends_on:
      - postgres
    networks:
      - myeduconnect-net
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: myeduconnect-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - myeduconnect-net
    restart: unless-stopped

  # Phase 5 IDS — Suricata monitors all traffic to the backend on port 3000
  # network_mode: shares the backend container's network namespace so Suricata
  # sees every request nginx forwards to backend:3000
  ids:
    image: jasonish/suricata:latest
    container_name: myeduconnect-ids
    network_mode: "service:backend"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./ids/rules:/etc/suricata/rules:ro
      - ./ids/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ids_logs:/var/log/suricata
    command: -c /etc/suricata/suricata.yaml --af-packet=eth0 -v
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  ids_logs:

networks:
  myeduconnect-net:
    driver: bridge
